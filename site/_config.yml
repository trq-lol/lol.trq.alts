title: lol.trq.alts
description: A Minecraft Java Edition account library for Java 25, covering sign-in, account management, bulk operations, an encrypted local store and a shared vault.
url: https://alts.trq.lol
baseurl: ""
wordmark: alts
tagline: "Minecraft: Java Edition accounts for Java: sign in, manage, store and share them."
license: MIT
repo: https://github.com/trq-lol/lol.trq.alts

nav:
  - { title: Start, url: /docs/GETTING_STARTED.html }
  - { title: Sign-in, url: /docs/SIGN_IN.html }
  - { title: Accounts, url: /docs/ACCOUNTS.html }
  - { title: Storage, url: /docs/STORAGE.html }
  - { title: Vault, url: /docs/VAULT.html }
  - { title: API, url: /api/ }
  - { title: llms.txt, url: /llms.txt }
  - { title: GitHub, url: "https://github.com/trq-lol/lol.trq.alts" }

defaults:
  - scope:
      path: ""
    values:
      layout: default

kramdown:
  parse_block_html: true

exclude:
  - AGENTS.md
  - CLAUDE.md
  - README.md
  - api
  - build
  - gradle
  - src
  - "*.gradle"
  - gradlew
  - jitpack.yml
